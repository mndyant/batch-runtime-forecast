name: Verify portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit and API tests
        run: python -m pytest -q -p no:faulthandler
      - name: Verify frozen files
        run: python -m evaluation.benchmark --verify
      - name: Reproduce saved forecasts and scores
        run: python tools/reproduce.py
